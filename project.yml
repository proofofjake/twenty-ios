name: TwentyCRM
options:
  bundleIdPrefix: io.tgbp
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "Y593FLDW4H"
    CODE_SIGN_STYLE: Automatic

targets:
  TwentyCRM:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # XcodeGen picks the build phase from the file type (asset catalogs → Resources).
      - path: Resources
    # Local builds only: bundle Claude's guesses for More → Claude's educated
    # guesses. Config/claude-guesses.json is private CRM data (gitignored), so
    # Release builds never copy it, and Debug builds without it still build.
    postBuildScripts:
      - name: Bundle Claude's guesses (Debug only)
        # Runs every build: the input may come and go.
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Config/claude-guesses.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/claude-guesses.json
        script: |
          dest="${SCRIPT_OUTPUT_FILE_0}"
          if [ "${CONFIGURATION}" = "Debug" ] && [ -f "${SCRIPT_INPUT_FILE_0}" ]; then
            cp "${SCRIPT_INPUT_FILE_0}" "${dest}"
            echo "Bundled Claude's guesses"
          else
            rm -f "${dest}"
          fi
    info:
      path: Sources/App/Info.plist
      properties:
        # "CRM Local" on Debug (Xcode / devicectl installs), "CRM" on Release (TestFlight).
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS; skips the export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tgbp.twentycrm
        APP_DISPLAY_NAME: CRM
        MARKETING_VERSION: "1.0"
        # scripts/testflight.sh overrides this with a timestamp per upload.
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # Local builds look different from the TestFlight app: name, orange
        # icon (AppIcon-Local) and an orange frame around the screen (#if DEBUG).
        Debug:
          APP_DISPLAY_NAME: CRM Local
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Local

  TwentyCRMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TwentyCRM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TwentyCRM.app/TwentyCRM

  TwentyCRMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TwentyCRM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TwentyCRM

schemes:
  TwentyCRM:
    build:
      targets:
        TwentyCRM: all
        TwentyCRMTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TwentyCRMTests
        - TwentyCRMUITests
